name: test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  # The MARS and the arena under ASan/UBSan, and the binary, on both hosts.
  # filo-term and Filo are sibling checkouts, as on a developer's disk.
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          path: corewar
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/filo-term
          path: filo-term
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/clang_filo
          path: clang_filo
      - run: make -C corewar all test

  # The pick compiled by Go's filo and by C's must be the same bytes:
  # it cannot matter which one a user has.
  filo-go-c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          path: corewar
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/filo-term
          path: filo-term
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/clang_filo
          path: clang_filo
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/crgimenes/filo/cmd/filo@latest
      - run: |
          make -C corewar corewar.fbb
          mv corewar/corewar.fbb c.fbb
          rm -f corewar/build/corewar.fbc
          make -C corewar corewar.fbb FILO_CLI="$(go env GOPATH)/bin/filo"
          cmp corewar/corewar.fbb c.fbb

  # The release's Linux binary: musl, static, nothing to install.
  static:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    container: alpine:3.22
    steps:
      - run: apk add clang make musl-dev file go git
      - uses: actions/checkout@v4
        with:
          path: corewar
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/filo-term
          path: filo-term
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/clang_filo
          path: clang_filo
      - run: go install github.com/crgimenes/filo/cmd/filo@latest
      - run: make -C corewar all CC=clang LDFLAGS=-static FILO_CLI="$(go env GOPATH)/bin/filo"
      - run: file corewar/bin/corewar | grep -q "statically linked"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: corewar
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/filo-term
          path: filo-term
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/clang_filo
          path: clang_filo
      - name: Install tools
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23
          sudo apt-get install -y clang-format-23 clang-tidy-23 cppcheck
      - run: make -C corewar fmt-check tidy check CLANG_FORMAT=clang-format-23 CLANG_TIDY=clang-tidy-23
